<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Price Alert</title>
</head>
<body>
    <h2>Price Alert for {{.Game.Name}}</h2>
    <p>Good news! The price has dropped below your target.</p>
    <table>
        <tr>
            <td><strong>Game:</strong></td>
            <td>{{.Game.Name}}</td>
        </tr>
        <tr>
            <td><strong>Current price:</strong></td>
            <td>{{.CurrentPrice}}</td>
        </tr>
        <tr>
            <td><strong>Your target price:</strong></td>
            <td>{{.TargetPrice}}</td>
        </tr>
    </table>
    <p>Go grab it while it lasts!</p>
</body>
</html>
